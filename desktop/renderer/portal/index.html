<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spoon Manager · 配信に参加</title><link rel="stylesheet" href="portal.css"><script type="module" src="portal.js"></script></head><body><header>Spoon Manager <span>配信に参加</span></header><main><h1 id="title">配信に参加</h1><section id="identify"><h2>Spoonアカウントを確認</h2><p>配信のSpoonチャットに、次のコマンドを送信してください。</p><code id="code">読み込み中…</code><button id="copy">コピー</button><p>確認コードは10分間有効です。このページを開いたままSpoonのチャットに送信してください。</p></section><p id="status" role="status"></p><section id="question" hidden><h2>質問・リクエスト</h2><form><label>種類<select id="request-kind"><option value="question">質問</option><option value="request">リクエスト</option></select></label><label>内容<textarea id="text" maxlength="500" rows="5" required></textarea></label><button type="submit">送信</button></form></section><section id="game" hidden><div class="actions"><select id="mode" aria-label="対戦相手"><option value="bot">ボットと対戦</option><option value="pvp">リスナーと対戦</option></select><button id="start">対局を開始</button><button id="end">投了</button></div><p id="game-status"></p><div id="board"></div><div id="hands"></div><label id="promotion"><input type="checkbox" id="promote">成る</label><p>移動する駒と移動先を順番に押してください。リバーシは候補のマスを押すと着手します。</p></section></main></body></html>
